name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests before release
        run: go test ./...

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .deb packages for APT repo
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages
          path: dist/*.deb
          if-no-files-found: error

  publish-apt:
    needs: release
    if: always() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.release.result == 'skipped'))
    runs-on: ubuntu-latest
    steps:
      - name: Check GPG signing secret
        id: check_gpg
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "${GPG_PRIVATE_KEY:-}" ]; then
            echo "has_gpg=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GPG_PRIVATE_KEY secret is not configured; skipping GitHub Pages APT repository update. GitHub Release assets (.deb, .rpm, .apk, Arch, .tar.gz) were still published."
            echo "has_gpg=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install APT packaging tools
        if: steps.check_gpg.outputs.has_gpg == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev apt-utils gnupg

      - name: Download .deb packages from release artifact
        if: steps.check_gpg.outputs.has_gpg == 'true' && github.event_name != 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: deb-packages
          path: /tmp/debs

      - name: Download .deb packages from latest GitHub Release
        if: steps.check_gpg.outputs.has_gpg == 'true' && github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/debs
          curl -fsSL -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/latest" \
            -o /tmp/latest-release.json
          python3 - << 'PY'
          import json, os, urllib.request
          with open("/tmp/latest-release.json") as f:
              rel = json.load(f)
          debs = [a for a in rel.get("assets", []) if a["name"].endswith(".deb")]
          if not debs:
              raise SystemExit("::error::No .deb assets found in latest GitHub Release.")
          for a in debs:
              dst = os.path.join("/tmp/debs", a["name"])
              print("Downloading", a["name"], "from", a["browser_download_url"])
              urllib.request.urlretrieve(a["browser_download_url"], dst)
          PY

      - name: Checkout repository for gh-pages
        if: steps.check_gpg.outputs.has_gpg == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update signed APT repository on gh-pages
        if: steps.check_gpg.outputs.has_gpg == 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail

          export GNUPGHOME="$(mktemp -d)"
          chmod 700 "$GNUPGHOME"
          trap 'rm -rf "$GNUPGHOME"' EXIT

          printf 'allow-loopback-pinentry\n' > "$GNUPGHOME/gpg-agent.conf"
          printf 'batch\nyes\npinentry-mode loopback\n' > "$GNUPGHOME/gpg.conf"

          KEY_FILE="$GNUPGHOME/private.key"
          printf '%s\n' "$GPG_PRIVATE_KEY" | tr -d '\r' > "$KEY_FILE"
          if ! grep -q "BEGIN PGP PRIVATE KEY BLOCK" "$KEY_FILE"; then
            if tr -d '\r\n ' < "$KEY_FILE" | base64 -d > "$KEY_FILE.decoded" 2>/dev/null; then
              mv "$KEY_FILE.decoded" "$KEY_FILE"
            fi
          fi
          if ! grep -q "BEGIN PGP PRIVATE KEY BLOCK" "$KEY_FILE"; then
            echo "::error::GPG_PRIVATE_KEY secret does not contain a valid PGP private key block (export with: gpg --armor --export-secret-keys <KEY_ID>)."
            exit 1
          fi

          PASS_ARGS=()
          if [ -n "${GPG_PASSPHRASE:-}" ]; then
            PASS_FILE="$GNUPGHOME/passphrase"
            (umask 077 && printf '%s' "$GPG_PASSPHRASE" > "$PASS_FILE")
            PASS_ARGS=(--passphrase-file "$PASS_FILE")
          fi

          if ! gpg ${PASS_ARGS[@]+"${PASS_ARGS[@]}"} --import "$KEY_FILE"; then
            echo "::error::Failed to import GPG_PRIVATE_KEY. Verify the armored secret key and GPG_PASSPHRASE secret."
            exit 1
          fi

          KEY_ID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/{f=1} f && /^fpr:/{print $10; exit}')"
          if [ -z "$KEY_ID" ]; then
            echo "::error::No GPG secret key fingerprint found after import. Ensure GPG_PRIVATE_KEY contains a secret key (not a public key)."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout -B gh-pages origin/gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
          fi

          touch .nojekyll
          cat > index.html << 'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8" />
            <title>ez-ssh APT Repository</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 760px; margin: 3rem auto; padding: 0 1rem; line-height: 1.6; }
              pre { background: #181825; color: #cdd6f4; padding: 1rem; border-radius: 8px; overflow-x: auto; }
              a { color: #1e66f5; }
            </style>
          </head>
          <body>
            <h1>ez-ssh Ubuntu / Debian APT Repository</h1>
            <p>Install and keep <code>ez-ssh</code> up to date via <code>apt</code>:</p>
            <pre>curl -fsSL https://ib-jpg.github.io/ez-ssh/apt/gpg.key | sudo gpg --dearmor -o /usr/share/keyrings/ez-ssh-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/ez-ssh-archive-keyring.gpg] https://ib-jpg.github.io/ez-ssh/apt stable main" | sudo tee /etc/apt/sources.list.d/ez-ssh.list
          sudo apt update &amp;&amp; sudo apt install ez-ssh</pre>
            <p>Source code &amp; multi-distro packages: <a href="https://github.com/ib-jpg/ez-ssh">github.com/ib-jpg/ez-ssh</a></p>
          </body>
          </html>
          HTML

          mkdir -p apt/pool/main
          cp -f /tmp/debs/*.deb apt/pool/main/

          pushd apt >/dev/null
          for arch in amd64 arm64 i386; do
            mkdir -p "dists/stable/main/binary-${arch}"
            dpkg-scanpackages --arch "$arch" --multiversion pool/main > "dists/stable/main/binary-${arch}/Packages"
            gzip -9 -k -f "dists/stable/main/binary-${arch}/Packages"
          done

          pushd dists/stable >/dev/null
          rm -f Release Release.gpg InRelease
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="ez-ssh" \
            -o APT::FTPArchive::Release::Label="ez-ssh" \
            -o APT::FTPArchive::Release::Suite="stable" \
            -o APT::FTPArchive::Release::Codename="stable" \
            -o "APT::FTPArchive::Release::Architectures=amd64 arm64 i386" \
            -o APT::FTPArchive::Release::Components="main" \
            release . > /tmp/Release
          mv /tmp/Release Release

          if ! gpg ${PASS_ARGS[@]+"${PASS_ARGS[@]}"} --digest-algo SHA256 --local-user "$KEY_ID" --detach-sign --armor -o Release.gpg Release || \
             ! gpg ${PASS_ARGS[@]+"${PASS_ARGS[@]}"} --digest-algo SHA256 --local-user "$KEY_ID" --clearsign -o InRelease Release; then
            echo "::error::Failed to sign APT Release metadata with GPG key $KEY_ID. If your GPG key is passphrase-protected, ensure GPG_PASSPHRASE secret matches it."
            exit 1
          fi
          popd >/dev/null

          gpg --armor --export "$KEY_ID" > gpg.key
          gpg --dearmor < gpg.key > /tmp/ez-ssh-verify.gpg
          gpgv --keyring /tmp/ez-ssh-verify.gpg dists/stable/InRelease
          gpgv --keyring /tmp/ez-ssh-verify.gpg dists/stable/Release.gpg dists/stable/Release
          rm -f /tmp/ez-ssh-verify.gpg
          popd >/dev/null

          git add .nojekyll index.html apt
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "apt: publish release ${GITHUB_REF_NAME:-manual}"
            if ! git push origin gh-pages; then
              echo "::error::Failed to push gh-pages branch. Ensure Settings -> Actions -> General -> Workflow permissions is set to 'Read and write permissions'."
              exit 1
            fi
          else
            echo "APT repository already up to date."
          fi
